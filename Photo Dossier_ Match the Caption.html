<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Photo Dossier: Match the Caption</title>
<style>
:root{--bg:#0a0d0c;--panel:#131917;--line:#25302c;--text:#e6efe9;--muted:#93a39a;--accent:#00ff88;--ok:#00ff88;--bad:#ff4d4d;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Courier New",ui-monospace,Menlo,Consolas,monospace;line-height:1.5;
background-image:radial-gradient(circle at 50% -10%,rgba(0,255,136,.09),transparent 55%)}
main{max-width:1080px;margin:0 auto;padding:32px 18px 56px}
h1{font-size:clamp(1.6rem,4.5vw,2.6rem);margin:0 0 10px;color:var(--accent);letter-spacing:.02em;text-shadow:0 0 18px rgba(0,255,136,.35)}
.intro{color:var(--muted);max-width:62ch;margin:0 0 28px}
.grid{display:grid;grid-template-columns:1fr;gap:18px}
@media(min-width:640px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:980px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px;display:flex;flex-direction:column;gap:10px}
.card img{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:3px;display:block;background:#000;filter:grayscale(.25) contrast(1.05)}
select{width:100%;padding:11px 10px;font:inherit;color:var(--text);background:#0c110f;border:2px solid var(--line);border-radius:4px}
select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
select.correct{border-color:var(--ok)}
select.incorrect{border-color:var(--bad)}
.actions{margin-top:26px;display:flex;flex-direction:column;align-items:flex-start;gap:14px}
button{font:inherit;font-weight:700;font-size:1.05rem;padding:13px 34px;color:#04130c;background:var(--accent);border:0;border-radius:4px;cursor:pointer}
button:hover{filter:brightness(1.1)}
#msg{margin:0;min-height:1.5em;color:var(--bad);font-weight:700}
#success{display:none;min-height:70vh;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:18px}
#success h2{font-size:clamp(2rem,7vw,4rem);margin:0;color:var(--accent);text-shadow:0 0 28px rgba(0,255,136,.5)}
#success p{font-size:clamp(1rem,2.6vw,1.4rem);color:var(--text);margin:0;max-width:40ch}
.hidden{display:none!important}
</style>
</head>
<body>
<main>
  <div id="game">
    <h1>Photo Dossier: Match the Caption</h1>
    <p class="intro">The captions are mixed up. Match each photo to its correct caption. When everything matches, you’ll see a message.</p>
    <div class="grid" id="grid"></div>
    <div class="actions">
      <button id="check" type="button">Check</button>
      <p id="msg" role="status" aria-live="polite"></p>
    </div>
  </div>
  <section id="success" role="alert">
    <h2>Access granted. Photo dossier closed.</h2>
    <p>You officially passed the check. Tomorrow at 9 PM — next step. HQ.</p>
  </section>
</main>

const captions = [
  "The happiest smile",
  "Russian gangster",
  "Terrorist",
  "Building THAT body",
  "Monster sponsored",
  "My spider man",
  "My LOVE",
  "Blurb Blurb"
];

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

const grid = document.getElementById('grid');
const msg = document.getElementById('msg');
const optionOrder = shuffle(captions); // same options, same order, on every card

shuffle(photos).forEach(p => {
  const card = document.createElement('div');
  card.className = 'card';
  const img = document.createElement('img');
  img.src = p.url;
  img.alt = 'Dossier photo ' + p.id;
  const sel = document.createElement('select');
  sel.dataset.id = p.id;
  sel.setAttribute('aria-label', 'Caption for photo ' + p.id);
  const ph = document.createElement('option');
  ph.value = ''; ph.textContent = '— Choose a caption —';
  sel.appendChild(ph);
  optionOrder.forEach(c => {
    const o = document.createElement('option');
    o.value = c; o.textContent = c;
    sel.appendChild(o);
  });
  sel.addEventListener('change', () => { sel.classList.remove('correct','incorrect'); });
  card.append(img, sel);
  grid.appendChild(card);
});

document.getElementById('check').addEventListener('click', () => {
  let allCorrect = true;
  grid.querySelectorAll('select').forEach(sel => {
    const p = photos.find(x => String(x.id) === sel.dataset.id);
    const ok = sel.value === p.correctCaption;
    sel.classList.toggle('correct', ok);
    sel.classList.toggle('incorrect', !ok);
    if (!ok) allCorrect = false;
  });
  if (allCorrect) {
    document.getElementById('game').classList.add('hidden');
    document.getElementById('success').style.display = 'flex';
    window.scrollTo(0, 0);
  } else {
    msg.textContent = 'Not everything matches. Try again.';
  }
});
</script>
